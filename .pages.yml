media:
  - name: blog-images
    label: Blog images
    input: assets/img/blog
    output: /assets/img/blog
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

content:
  - name: blog
    label: Blog articles
    type: collection
    path: src/content/posts
    filename: "{slug}.json"
    format: json
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Lowercase words separated by hyphens; this becomes /blog/your-slug.html.
      - name: title
        label: Article title
        type: string
        required: true
      - name: category
        label: Category
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Author
        type: string
        required: true
      - name: dek
        label: Summary
        type: text
        required: true
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: html
          media: blog-images
          path: blog
          extensions: [jpg, jpeg, png, webp, gif, svg]
          rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Add blog article: {filename}"
      update: "Update blog article: {filename}"
      delete: "Delete blog article: {filename}"
